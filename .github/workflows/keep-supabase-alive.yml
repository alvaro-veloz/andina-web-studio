name: Keep Supabase Alive

on:
  schedule:
    # Corre todos los lunes a las 9:00 UTC (ajustá la hora si querés)
    - cron: '0 9 * * 1'
  workflow_dispatch: # también podés correrlo a mano desde GitHub si querés probarlo

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar Supabase para mantenerlo activo
        run: |
          curl -s -X GET \
            "https://wdyrxrunmjrxgaputcol.supabase.co/rest/v1/citas?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
